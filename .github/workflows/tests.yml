name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # The analytics modules + tests are stdlib-only, so the unittest suite
      # runs with zero pip dependencies. py_compile validates the core
      # modules without importing them (no cv2/requests needed).
      - name: Syntax-check every module
        run: |
          python -m py_compile \
            analytics/*.py core/*.py tests/*.py

      - name: Run unittest suite
        run: python -m unittest discover -s tests -v
